<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Stats: 3D Coin Flip Simulation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #1f2937; margin-bottom: 24px; }
        
        /* Form styling */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        /* 3D Coin Container */
        .coin-viewport {
            perspective: 1000px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .coin {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            border: 4px solid #b45309; /* Deep gold rim */
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.15);
        }
        .heads {
            background: linear-gradient(135deg, #fcd34d, #f59e0b); /* Bright gold */
            color: #78350f;
        }
        .tails {
            background: linear-gradient(135deg, #fbbf24, #d97706); /* Darker gold */
            color: #78350f;
            transform: rotateY(180deg);
        }
        .label-text {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Action elements */
        button {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #047857; }
        
        /* Results Box */
        .results {
            margin-top: 24px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #e5e7eb;
            text-align: left;
        }
        th { background-color: #f9fafb; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Coin Flip Simulator</h1>
    
    <div class="form-group">
        <label for="trials">Number of Flips (Trials):</label>
        <input type="number" id="trials" value="1000" min="1" max="1000000">
    </div>
    
    <div class="form-group">
        <label for="targetEvent">Event to Track:</label>
        <select id="targetEvent">
            <option value="heads">Heads (Happy Face 😊)</option>
            <option value="tails">Tails (Sad Face 😢)</option>
        </select>
    </div>
    
    <div class="coin-viewport">
        <div class="coin" id="visualCoin">
            <div class="face heads">
                <div>😊</div>
                <div class="label-text">Heads</div>
            </div>
            <div class="face tails">
                <div>😢</div>
                <div class="label-text">Tails</div>
            </div>
        </div>
    </div>
    
    <button onclick="runSimulation()">Flip Coin</button>
    
    <div class="results" id="resultsBox">
        <h3>Simulation Results</h3>
        <table>
            <tr>
                <th>Metric</th>
                <th>Value</th>
            </tr>
            <tr>
                <td>Total Flips Run</td>
                <td id="resTrials">0</td>
            </tr>
            <tr>
                <td>Successful Outcomes</td>
                <td id="resSuccess">0</td>
            </tr>
            <tr>
                <td><strong>Experimental Probability</strong></td>
                <td id="resExp">0%</td>
            </tr>
            <tr>
                <td><strong>Theoretical Probability</strong></td>
                <td id="resTheo">50.00%</td>
            </tr>
        </table>
    </div>
</div>

<script>
// Keep track of total degrees to ensure continuous rotations
let currentRotation = 0;

function runSimulation() {
    const totalTrials = parseInt(document.getElementById('trials').value);
    const targetEvent = document.getElementById('targetEvent').value;
    const coinElement = document.getElementById('visualCoin');
    
    if (isNaN(totalTrials) || totalTrials <= 0) {
        alert("Please enter a valid number of trials.");
        return;
    }

    let successCount = 0;
    let finalFlip = 'heads';

    // Fast loop calculation for statistics data array
    for (let i = 0; i < totalTrials; i++) {
        const flip = Math.random() < 0.5 ? 'heads' : 'tails';
        
        if (i === totalTrials - 1) {
            finalFlip = flip;
        }

        if (flip === targetEvent) {
            successCount++;
        }
    }

    // 3D Visual Spin Calculation
    // Adding extra rotations ensures it always loops satisfyingly
    let extraRotations = 1080; // 3 full extra turns
    if (finalFlip === 'heads') {
        currentRotation = Math.ceil(currentRotation / 360) * 360 + extraRotations;
    } else {
        currentRotation = Math.ceil((currentRotation - 180) / 360) * 360 + extraRotations + 180;
    }
    
    coinElement.style.transform = `rotateY(${currentRotation}deg)`;

    // Calculate probabilities
    const experimentalProb = successCount / totalTrials;

    // Render results to the table layout
    document.getElementById('resTrials').innerText = totalTrials.toLocaleString();
    document.getElementById('resSuccess').innerText = successCount.toLocaleString();
    document.getElementById('resExp').innerHTML = `<strong>${(experimentalProb * 100).toFixed(2)}%</strong> (${successCount}/${totalTrials})`;
    
    document.getElementById('resultsBox').style.display = 'block';
}
</script>

</body>
</html>
